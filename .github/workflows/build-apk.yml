name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          sed -i 's|window.print();|if(window.NZIStorage \&\& window.NZIStorage.printPage){window.NZIStorage.printPage();}else{window.print();}|' www/index.html
      - run: npx cap add android
      - name: Add NZI native bridge
        run: cp native/MainActivity.java android/app/src/main/java/com/nzi/pos/MainActivity.java
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NZI-POS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
